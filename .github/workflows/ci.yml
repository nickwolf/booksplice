name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  media-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned FFmpeg from source
        shell: pwsh
        run: ./scripts/Build-MediaTools.ps1 -DestinationDirectory ./artifacts/tools/ffmpeg/source-build
      - uses: actions/upload-artifact@v4
        with:
          name: booksplice-source-built-ffmpeg
          path: artifacts/tools/ffmpeg/source-build/
          if-no-files-found: error
  build-and-test:
    needs: media-tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test private acceptance harness safeguards
        shell: pwsh
        run: .\scripts\Test-AcceptanceHarness.ps1
      - run: dotnet restore
      - uses: actions/download-artifact@v4
        with:
          name: booksplice-source-built-ffmpeg
          path: artifacts/tools/ffmpeg/source-build
      - name: Resolve production and fixture tools
        shell: pwsh
        run: |
          .\scripts\Get-MediaTools.ps1 -ManifestPath .\tools\ffmpeg\fixture-generator-manifest.json -DestinationRoot .\artifacts\tools\fixtures
          $fixtureRelease = (Get-Content .\tools\ffmpeg\fixture-generator-manifest.json | ConvertFrom-Json).release
          "BOOKSPLICE_FFMPEG_DIR=$((Resolve-Path '.\artifacts\tools\ffmpeg\source-build\output').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOKSPLICE_FIXTURE_FFMPEG_DIR=$((Resolve-Path ".\artifacts\tools\fixtures\$fixtureRelease").Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify pinned FFmpeg component inventory
        shell: pwsh
        run: .\scripts\Get-FFmpegLicenseInventory.ps1 -MediaToolDirectory $env:BOOKSPLICE_FFMPEG_DIR -Check
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet format --verify-no-changes --no-restore
      - name: Build and test release package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 -Version 0.1.0-ci -MediaToolDirectory $env:BOOKSPLICE_FFMPEG_DIR
          .\scripts\Test-Release.ps1 -ArchivePath .\artifacts\release\BookSplice-0.1.0-ci-win-x64.zip -ChecksumPath .\artifacts\release\BookSplice-0.1.0-ci-win-x64.zip.sha256

  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
