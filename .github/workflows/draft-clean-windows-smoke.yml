name: Draft clean Windows smoke

on:
  push:
    branches:
      - codex/private-acceptance-harness
    paths:
      - .github/workflows/draft-clean-windows-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Remove and verify .NET SDKs on the fresh VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            (Join-Path $env:ProgramFiles 'dotnet'),
            (Join-Path ${env:ProgramFiles(x86)} 'dotnet'),
            (Join-Path $env:RUNNER_TOOL_CACHE 'dotnet'),
            (Join-Path $env:USERPROFILE '.dotnet')
          ) | Select-Object -Unique
          $hosts = @(Get-Command dotnet -All -ErrorAction SilentlyContinue |
            Where-Object CommandType -eq Application |
            Select-Object -ExpandProperty Source -Unique)
          $initialSdks = @(& dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0 -or $initialSdks.Count -eq 0) {
            throw 'Fresh runner did not report its expected preinstalled SDKs.'
          }
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root -PathType Container)) { continue }
            $rootItem = Get-Item -LiteralPath $root -Force
            if (($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Refusing reparse-point .NET root: $root"
            }
            $sdk = Join-Path $rootItem.FullName 'sdk'
            if (-not (Test-Path -LiteralPath $sdk -PathType Container)) { continue }
            $sdkItem = Get-Item -LiteralPath $sdk -Force
            if ($sdkItem.Name -cne 'sdk' -or
                [IO.Path]::GetFullPath((Split-Path -Parent $sdkItem.FullName)) -cne [IO.Path]::GetFullPath($rootItem.FullName) -or
                ($sdkItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Refusing unexpected SDK directory: $sdk"
            }
            if (@(Get-ChildItem -LiteralPath $sdkItem.FullName -Recurse -Force -Attributes ReparsePoint).Count -ne 0) {
              throw "Refusing reparse point inside SDK directory: $sdk"
            }
            Remove-Item -LiteralPath $sdkItem.FullName -Recurse -Force
          }
          foreach ($root in $roots) {
            if (Test-Path -LiteralPath (Join-Path $root 'sdk')) {
              throw "SDK directory remains under $root"
            }
          }
          $hosts += @(Get-Command dotnet -All -ErrorAction SilentlyContinue |
            Where-Object CommandType -eq Application |
            Select-Object -ExpandProperty Source -Unique)
          foreach ($hostPath in ($hosts | Select-Object -Unique)) {
            if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) { continue }
            $sdks = @(& $hostPath --list-sdks)
            if ($LASTEXITCODE -ne 0 -or $sdks.Count -ne 0) {
              throw "Installed SDKs remain visible through $hostPath"
            }
          }
          Write-Output 'No SDK directory or installed SDK reported by the discovered .NET hosts.'

      - name: Download and verify the exact unpublished draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BOOKSPLICE_DRAFT_READ_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = @(gh api repos/nickwolf/booksplice/releases | ConvertFrom-Json |
            Where-Object { $_.tag_name -eq 'v0.1.0' -and $_.draft })
          if ($release.Count -ne 1) { throw 'Expected one unpublished v0.1.0 draft.' }
          $names = @(
            'BookSplice-0.1.0-win-x64.zip',
            'BookSplice-0.1.0-win-x64.zip.sha256',
            'Test-Release.ps1',
            'ReleaseOwnedDirectory.ps1'
          )
          if (@($release[0].assets).Count -ne $names.Count) {
            throw 'Draft asset count changed.'
          }
          $dir = Join-Path $env:RUNNER_TEMP ('booksplice-draft-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download v0.1.0 --repo nickwolf/booksplice --dir $dir --pattern '*'
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed.' }
          foreach ($name in $names) {
            $asset = @($release[0].assets | Where-Object name -eq $name)
            $file = Join-Path $dir $name
            if ($asset.Count -ne 1 -or -not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Draft asset missing or duplicated: $name"
            }
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -cne $asset[0].digest) { throw "Draft asset digest mismatch: $name" }
          }
          $zip = Join-Path $dir $names[0]
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -cne '591c1cb45ebb7c7774fcee0d155c13fed581694486192d7d1fbff1494b822a2d') {
            throw 'Draft ZIP differs from the privately accepted CLI package.'
          }
          "BOOKSPLICE_DRAFT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Verified four downloaded draft assets; ZIP SHA-256 $zipHash"

      - name: Run the downloaded WPF and CLI smoke
        shell: pwsh
        run: |
          $dir = $env:BOOKSPLICE_DRAFT_DIR
          if (@(& dotnet --list-sdks).Count -ne 0) {
            throw 'SDKs appeared before the draft smoke.'
          }
          & pwsh -NoProfile -File (Join-Path $dir 'Test-Release.ps1') `
            -ArchivePath (Join-Path $dir 'BookSplice-0.1.0-win-x64.zip') `
            -ChecksumPath (Join-Path $dir 'BookSplice-0.1.0-win-x64.zip.sha256')
          if ($LASTEXITCODE -ne 0) { throw "Draft smoke exited with code $LASTEXITCODE" }