name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  media-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Build pinned FFmpeg from source
        shell: pwsh
        run: ./scripts/Build-MediaTools.ps1 -DestinationDirectory ./artifacts/tools/ffmpeg/source-build
      - uses: actions/upload-artifact@v4
        with:
          name: booksplice-source-built-ffmpeg
          path: artifacts/tools/ffmpeg/source-build/
          if-no-files-found: error
  publish:
    needs: media-tools
    runs-on: windows-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve release version
        shell: pwsh
        env:
          BOOKSPLICE_REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:BOOKSPLICE_REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag '$releaseTag'." }
          $version = $releaseTag.Substring(1)
          git fetch --force origin "refs/tags/$($releaseTag):refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch release tag '$releaseTag'." }
          $tagType = (git cat-file -t "refs/tags/$releaseTag").Trim()
          if ($tagType -ne 'tag') { throw "Release tag '$releaseTag' must be annotated." }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
          $tagCommit = (git rev-list -n 1 "refs/tags/$releaseTag").Trim()
          if ((git rev-parse HEAD).Trim() -ne $tagCommit) { throw "Checkout does not match release tag '$releaseTag'." }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag '$releaseTag' is not reachable from origin/main." }
          "BOOKSPLICE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOKSPLICE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Require signing configuration
        shell: pwsh
        env:
          BOOKSPLICE_UPDATE_SIGNING_KEY: ${{ secrets.BOOKSPLICE_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BOOKSPLICE_UPDATE_SIGNING_KEY)) { throw 'BOOKSPLICE_UPDATE_SIGNING_KEY is not configured in the release-signing environment.' }
          if (-not (Test-Path -LiteralPath .\src\BookSplice.Updates\Trust\production-public-key.pem -PathType Leaf)) { throw 'The reviewed production public key is not embedded in this tag.' }
      - run: dotnet restore
      - uses: actions/download-artifact@v4
        with:
          name: booksplice-source-built-ffmpeg
          path: artifacts/tools/ffmpeg/source-build
      - name: Resolve production and fixture tools
        shell: pwsh
        run: |
          .\scripts\Get-MediaTools.ps1 -ManifestPath .\tools\ffmpeg\fixture-generator-manifest.json -DestinationRoot .\artifacts\tools\fixtures
          $fixtureRelease = (Get-Content .\tools\ffmpeg\fixture-generator-manifest.json | ConvertFrom-Json).release
          "BOOKSPLICE_FFMPEG_DIR=$((Resolve-Path '.\artifacts\tools\ffmpeg\source-build\output').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOKSPLICE_FIXTURE_FFMPEG_DIR=$((Resolve-Path ".\artifacts\tools\fixtures\$fixtureRelease").Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify pinned FFmpeg component inventory
        shell: pwsh
        run: .\scripts\Get-FFmpegLicenseInventory.ps1 -MediaToolDirectory $env:BOOKSPLICE_FFMPEG_DIR -Check
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build -m:1
      - run: dotnet format --verify-no-changes --no-restore
      - name: Build and test release package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 -Version $env:BOOKSPLICE_VERSION -MediaToolDirectory $env:BOOKSPLICE_FFMPEG_DIR -Flavor Release
          .\scripts\Test-Release.ps1 -ArchivePath ".\artifacts\release\BookSplice-$env:BOOKSPLICE_VERSION-win-x64.zip" -ChecksumPath ".\artifacts\release\BookSplice-$env:BOOKSPLICE_VERSION-win-x64.zip.sha256"
      - name: Sign and verify update manifest
        shell: pwsh
        env:
          BOOKSPLICE_UPDATE_SIGNING_KEY: ${{ secrets.BOOKSPLICE_UPDATE_SIGNING_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'update-signing-key.pem'
          try {
            [IO.File]::WriteAllText($keyPath, $env:BOOKSPLICE_UPDATE_SIGNING_KEY)
            $archive = ".\artifacts\release\BookSplice-$env:BOOKSPLICE_VERSION-win-x64.zip"
            $publicKey = '.\src\BookSplice.Updates\Trust\production-public-key.pem'
            $signed = .\scripts\booksplice\New-UpdateManifest.ps1 -ArchivePath $archive -Version $env:BOOKSPLICE_VERSION -SigningKeyPath $keyPath -PublicKeyPath $publicKey -OutputDirectory .\artifacts\release-signed
            .\scripts\booksplice\Test-UpdateManifest.ps1 -ArchivePath $archive -ManifestPath $signed.ManifestPath -SignaturePath $signed.SignaturePath -PublicKeyPath $publicKey | Out-Null
          }
          finally { Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/BookSplice-*-win-x64.zip
      - name: Build and verify SHA256SUMS
        shell: pwsh
        run: |
          $v = $env:BOOKSPLICE_VERSION
          $assets = @(
            ".\artifacts\release\BookSplice-$v-win-x64.zip",
            ".\artifacts\release\BookSplice-$v-win-x64.zip.sha256",
            ".\artifacts\release-signed\BookSplice-$v-win-x64.update.json",
            ".\artifacts\release-signed\BookSplice-$v-win-x64.update.sig.json",
            '.\scripts\booksplice\Test-UpdateManifest.ps1',
            '.\scripts\booksplice\UpdateSigning.ps1',
            '.\scripts\Test-Release.ps1',
            '.\scripts\ReleaseOwnedDirectory.ps1'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset '$asset'." }
          }
          foreach ($dir in '.\artifacts\release', '.\artifacts\release-signed') {
            $found = @(Get-ChildItem -LiteralPath $dir -File)
            $wanted = @($assets | Where-Object { (Split-Path -Parent $_) -eq $dir })
            if ($found.Count -ne $wanted.Count) { throw "Expected $($wanted.Count) files in '$dir', found $($found.Count): $($found.Name -join ', ')." }
          }
          $sumsDir = '.\artifacts\release-sums'
          New-Item -ItemType Directory -Force -Path $sumsDir | Out-Null
          $sumsPath = Join-Path $sumsDir 'SHA256SUMS'
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $asset)"
          }
          [IO.File]::WriteAllText($sumsPath, (($lines -join "`n") + "`n"))
          $byName = @{}
          foreach ($asset in $assets) { $byName[(Split-Path -Leaf $asset)] = $asset }
          $entries = @(Get-Content -LiteralPath $sumsPath)
          if ($entries.Count -ne $assets.Count) { throw "SHA256SUMS has $($entries.Count) entries, expected $($assets.Count)." }
          foreach ($entry in $entries) {
            $hash, $name = $entry -split '  ', 2
            if (-not $byName.ContainsKey($name)) { throw "SHA256SUMS lists unexpected file '$name'." }
            $actual = (Get-FileHash -LiteralPath $byName[$name] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) { throw "SHA256SUMS mismatch for '$name'." }
          }
          Get-Content -LiteralPath $sumsPath
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ env.BOOKSPLICE_TAG }}
          body: |
            Automated build of BookSplice ${{ env.BOOKSPLICE_TAG }}. The release notes are added to this draft before it is published. Verify the ZIP against its .sha256 file or SHA256SUMS; the signed update files are BookSplice-${{ env.BOOKSPLICE_VERSION }}-win-x64.update.json and .update.sig.json.
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/release/BookSplice-*-win-x64.zip
            artifacts/release/BookSplice-*-win-x64.zip.sha256
            artifacts/release-signed/BookSplice-*-win-x64.update.json
            artifacts/release-signed/BookSplice-*-win-x64.update.sig.json
            scripts/booksplice/Test-UpdateManifest.ps1
            scripts/booksplice/UpdateSigning.ps1
            scripts/Test-Release.ps1
            scripts/ReleaseOwnedDirectory.ps1
            artifacts/release-sums/SHA256SUMS
