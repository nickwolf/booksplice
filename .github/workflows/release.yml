name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  media-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Build pinned FFmpeg from source
        shell: pwsh
        run: ./scripts/Build-MediaTools.ps1 -DestinationDirectory ./artifacts/tools/ffmpeg/source-build
      - uses: actions/upload-artifact@v4
        with:
          name: booksplice-source-built-ffmpeg
          path: artifacts/tools/ffmpeg/source-build/
          if-no-files-found: error
  publish:
    needs: media-tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve release version
        shell: pwsh
        env:
          BOOKSPLICE_REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:BOOKSPLICE_REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag '$releaseTag'." }
          $version = $releaseTag.Substring(1)
          git fetch --force origin "refs/tags/$($releaseTag):refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch release tag '$releaseTag'." }
          $tagType = (git cat-file -t "refs/tags/$releaseTag").Trim()
          if ($tagType -ne 'tag') { throw "Release tag '$releaseTag' must be annotated." }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
          $tagCommit = (git rev-list -n 1 "refs/tags/$releaseTag").Trim()
          if ((git rev-parse HEAD).Trim() -ne $tagCommit) { throw "Checkout does not match release tag '$releaseTag'." }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag '$releaseTag' is not reachable from origin/main." }
          $notes = ".\docs\releases\$releaseTag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes were not found at '$notes'." }
          "BOOKSPLICE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOKSPLICE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOKSPLICE_RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOKSPLICE_PRERELEASE=$($version.Contains('-').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: dotnet restore
      - uses: actions/download-artifact@v4
        with:
          name: booksplice-source-built-ffmpeg
          path: artifacts/tools/ffmpeg/source-build
      - name: Resolve production and fixture tools
        shell: pwsh
        run: |
          .\scripts\Get-MediaTools.ps1 -ManifestPath .\tools\ffmpeg\fixture-generator-manifest.json -DestinationRoot .\artifacts\tools\fixtures
          $fixtureRelease = (Get-Content .\tools\ffmpeg\fixture-generator-manifest.json | ConvertFrom-Json).release
          "BOOKSPLICE_FFMPEG_DIR=$((Resolve-Path '.\artifacts\tools\ffmpeg\source-build\output').Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BOOKSPLICE_FIXTURE_FFMPEG_DIR=$((Resolve-Path ".\artifacts\tools\fixtures\$fixtureRelease").Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify pinned FFmpeg component inventory
        shell: pwsh
        run: .\scripts\Get-FFmpegLicenseInventory.ps1 -MediaToolDirectory $env:BOOKSPLICE_FFMPEG_DIR -Check
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet format --verify-no-changes --no-restore
      - name: Build and test release package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 -Version $env:BOOKSPLICE_VERSION -MediaToolDirectory $env:BOOKSPLICE_FFMPEG_DIR
          .\scripts\Test-Release.ps1 -ArchivePath ".\artifacts\release\BookSplice-$env:BOOKSPLICE_VERSION-win-x64.zip" -ChecksumPath ".\artifacts\release\BookSplice-$env:BOOKSPLICE_VERSION-win-x64.zip.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/BookSplice-*-win-x64.zip
      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ env.BOOKSPLICE_TAG }}
          body_path: ${{ env.BOOKSPLICE_RELEASE_NOTES }}
          prerelease: ${{ env.BOOKSPLICE_PRERELEASE }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/release/BookSplice-*-win-x64.zip
            artifacts/release/BookSplice-*-win-x64.zip.sha256
            scripts/Test-Release.ps1
